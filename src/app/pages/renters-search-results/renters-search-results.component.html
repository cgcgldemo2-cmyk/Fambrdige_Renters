<main class="results-page">
  <app-store-header [store]="store"></app-store-header>
  <div class="container">
    <app-booking-search
      mode="form"
      [search]="search"
      (searchSubmitted)="onSearchUpdated($event)">
    </app-booking-search>

    <div class="content-layout">
      <app-results-filter class="desktop-filter" [filters]="filters" (filtersApplied)="onFiltersApplied($event)"></app-results-filter>
      <div class="main-content">
        <div class="results-top">
          <div>
            <h2>Search Results</h2>
            <p>{{ pagination?.total || 0 }} cars available</p>
          </div>
          <div class="toolbar-actions">
            <label class="sort-control"><span>Sort by</span>
              <select [(ngModel)]="sortBy" (change)="onSortChanged()">
                <option value="newest">Recommended</option>
                <option value="price_asc">Lowest Price</option>
                <option value="price_desc">Highest Price</option>
                <option value="seats_desc">Most Seats</option>
              </select>
            </label>
            <button class="filter-button" type="button" (click)="showMobileFilter = true">Filters</button>
          </div>
        </div>

        <div class="results-state" *ngIf="isLoading">Loading available vehicles...</div>
        <div class="results-state error" *ngIf="!isLoading && errorMessage">
          <p>{{ errorMessage }}</p>
          <button type="button" (click)="retrySearch()">Try Again</button>
        </div>
        <div class="results-state" *ngIf="!isLoading && !errorMessage && cars.length === 0">
          No vehicles are available for this search. Try different dates or search options.
        </div>

        <app-results-list
          *ngIf="!isLoading && !errorMessage && cars.length > 0"
          [cars]="cars"
          [search]="search">
        </app-results-list>
        <app-results-pagination
          [pagination]="pagination"
          (pageChanged)="onPageChanged($event)">
        </app-results-pagination>
      </div>
    </div>
  </div>

  <div class="filter-drawer" *ngIf="showMobileFilter" role="dialog" aria-modal="true" aria-label="Vehicle filters">
    <div class="drawer-backdrop" (click)="showMobileFilter = false"></div>
    <div class="drawer-panel">
      <div class="drawer-handle"></div>
      <div class="drawer-header">
        <strong>Refine results</strong>
        <button type="button" aria-label="Close filters" (click)="showMobileFilter = false">&times;</button>
      </div>
      <app-results-filter [filters]="filters" (filtersApplied)="onFiltersApplied($event)"></app-results-filter>
    </div>
  </div>
</main>

<div class="pagination" *ngIf="pagination && pagination.last_page > 1">
  <button type="button" [disabled]="pagination.current_page === 1" (click)="pageChanged.emit(pagination.current_page - 1)">Previous</button>
  <button type="button" *ngFor="let page of pages" [class.active]="page === pagination.current_page" (click)="pageChanged.emit(page)">{{page}}</button>
  <button type="button" [disabled]="pagination.current_page === pagination.last_page" (click)="pageChanged.emit(pagination.current_page + 1)">Next</button>
</div>

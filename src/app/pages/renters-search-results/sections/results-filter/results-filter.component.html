<aside class="filter-card">
  <div class="filter-head">
    <div><h3>Filters</h3><small>Narrow the available vehicles</small></div>
    <button type="button" (click)="clear()">Clear</button>
  </div>
  <label class="filter-group">
    <span>Rental Type</span>
    <select [(ngModel)]="draft.rentalType">
      <option value="">Any rental type</option><option>Self Drive</option><option>With Driver</option>
    </select>
  </label>
  <label class="filter-group">
    <span>Vehicle Type</span>
    <select [(ngModel)]="draft.vehicleType">
      <option value="">Any vehicle type</option><option *ngFor="let item of carTypes">{{ item }}</option>
    </select>
  </label>
  <label class="filter-group">
    <span>Transmission</span>
    <select [(ngModel)]="draft.transmission">
      <option value="">Any transmission</option><option>Automatic</option><option>Manual</option>
    </select>
  </label>
  <label class="filter-group">
    <span>Maximum Daily Price</span>
    <input type="number" min="0" step="500" [(ngModel)]="draft.maxPrice" placeholder="No maximum">
  </label>
  <button class="apply-btn" type="button" (click)="apply()">Apply Filters</button>
</aside>

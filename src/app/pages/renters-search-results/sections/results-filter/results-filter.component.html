<aside class="filter-card"><div class="filter-head"><h3>Filters</h3><button>Clear All</button></div><div class="filter-group"><h4>Vehicle Type</h4><label *ngFor="let item of vehicleTypes"><input type="checkbox" [checked]="item==='All Types'">{{item}}</label></div><div class="filter-group"><h4>Transmission</h4><label *ngFor="let item of transmissions"><input type="checkbox" [checked]="item==='All'">{{item}}</label></div><div class="filter-group"><h4>Seating Capacity</h4><label *ngFor="let item of seats"><input type="checkbox" [checked]="item==='All'">{{item}}</label></div><div class="filter-group"><h4>Price Range <span>(per day)</span></h4><input type="range" min="1000" max="6000" value="6000"><div class="range-label"><strong>₱1,000</strong><strong>₱6,000+</strong></div></div><button class="apply-btn">Apply Filters</button></aside>

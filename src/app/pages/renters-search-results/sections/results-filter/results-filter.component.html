<aside class="filter-card">
  <div class="filter-head">
    <h3>Filters</h3><button>Clear All</button>
  </div>
  <div class="filter-group">
    <h4>Rental Type</h4><label *ngFor="let item of rentalTypes"><input type="checkbox"
        [checked]="item==='All Rental Types'">{{item}}</label>
  </div>
  <div class="filter-group">
    <h4>Car Type</h4><label *ngFor="let item of carTypes"><input type="checkbox"
        [checked]="item==='All Types'">{{item}}</label>
  </div>
  <div class="filter-group">
    <h4>Insurance Coverage</h4><label *ngFor="let item of insuranceCoverages"><input type="checkbox"
        [checked]="item==='All Coverage'">{{item}}</label>
  </div>
  <div class="filter-group">
    <h4>Price Range <span>(per day)</span></h4><input type="range" min="1000" max="6000" value="6000">
    <div class="range-label"><strong>₱1,000</strong><strong>₱6,000+</strong></div>
  </div><button class="apply-btn">Apply Filters</button>
</aside>

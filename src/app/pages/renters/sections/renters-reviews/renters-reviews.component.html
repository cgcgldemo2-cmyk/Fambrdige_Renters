<section class="reviews container"><div class="reviews-head"><div><h2>What Renters Say</h2><p><strong>4.9/5</strong> ⭐⭐⭐⭐⭐ from 256 reviews</p></div><button>View all reviews →</button></div><div class="reviews-grid"><div class="review-card" *ngFor="let review of reviews"><div class="user"><img [src]="review.avatar" [alt]="review.name"><div><h4>{{review.name}}</h4><span>★★★★★</span></div></div><p>{{review.comment}}</p><small>{{review.date}}</small></div></div></section>

<section class="cars container">
  <div class="section-head"><div><h2>Popular vehicle options</h2><p>Preview common choices, then search live availability for your schedule.</p></div><a class="view-all" routerLink="/" fragment="search">Search Available Cars &rarr;</a></div>
  <div class="slider-wrapper">
    <button type="button" class="arrow left" (click)="prev()" [disabled]="currentIndex === 0" aria-label="Previous vehicles">&lsaquo;</button>
    <div class="cars-grid"><article class="car-card" *ngFor="let car of visibleCars"><span class="badge" *ngIf="car.badge">{{ car.badge }}</span><img [src]="car.image" [alt]="car.name"><h3>{{ car.name }}</h3><div class="meta"><span>{{ car.seats }} seats</span><span>{{ car.transmission }}</span></div><p class="price">&#8369;{{ car.price | number }} <small>/ {{ car.duration }}</small></p><a class="details-btn" routerLink="/" fragment="search">Check availability</a></article></div>
    <button type="button" class="arrow right" (click)="next()" [disabled]="currentIndex >= cars.length - 4" aria-label="Next vehicles">&rsaquo;</button>
  </div>
  <div class="dots" aria-label="Vehicle preview pages"><button type="button" *ngFor="let d of dots; let i = index" [class.active]="i === currentIndex" (click)="goTo(i)" [attr.aria-label]="'Show vehicle page ' + (i + 1)" [attr.aria-current]="i === currentIndex ? 'true' : null"></button></div>
</section>

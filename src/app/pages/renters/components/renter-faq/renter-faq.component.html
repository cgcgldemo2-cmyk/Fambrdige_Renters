<section class="faq-section">
  <h2>Frequently asked <span>questions</span></h2>

  <div class="faq-list">
    <article *ngFor="let item of faqs; let index = index" [class.open]="item.open">
      <button type="button" (click)="faqToggle.emit(index)">
        <strong>{{ item.question }}</strong>
        <span>{{ item.open ? '⌃' : '⌄' }}</span>
      </button>

      <p *ngIf="item.open">{{ item.answer }}</p>
    </article>
  </div>
</section>

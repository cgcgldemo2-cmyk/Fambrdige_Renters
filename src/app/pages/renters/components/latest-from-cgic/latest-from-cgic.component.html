<section class="news-section">
  <div class="section-heading">
    <div>
      <span>Stories and updates</span>
      <h2>Latest from CGIC</h2>
      <p>News, updates and stories to keep you moving.</p>
    </div>
    <a href="#">View all</a>
  </div>

  <div class="news-grid">
    <article *ngFor="let item of items">
      <img [src]="item.imageUrl" [alt]="item.title" />
      <div>
        <span>{{ item.category }}</span>
        <h3>{{ item.title }}</h3>
        <small>{{ item.date }}</small>
      </div>
    </article>
  </div>
</section>

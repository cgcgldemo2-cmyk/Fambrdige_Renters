<section id="book" class="hero-section">
  <div class="hero-bg-grid" aria-hidden="true"></div>
  <span class="hero-glow glow-one" aria-hidden="true"></span>
  <span class="hero-glow glow-two" aria-hidden="true"></span>
  <span class="floating-dot dot-one" aria-hidden="true"></span>
  <span class="floating-dot dot-two" aria-hidden="true"></span>
  <span class="floating-dot dot-three" aria-hidden="true"></span>

  <button type="button" class="hero-arrow left" aria-label="Previous banner">‹</button>
  <button type="button" class="hero-arrow right" aria-label="Next banner">›</button>

  <div class="hero-content">
    <div class="hero-copy gsap-hero-copy">
      <span class="hero-badge">Verified car rental platform</span>
      <h1>Travel easier with <span>CGIC</span></h1>
      <p>Book verified vehicles with transparent pricing, trusted lessors, and a smoother rental experience.</p>

      <div class="hero-points">
        <span class="gsap-trust-pill">🚗 Wide selections</span>
        <span class="gsap-trust-pill">🛡 Best price guarantee</span>
        <span class="gsap-trust-pill">⭐ Trusted by renters</span>
      </div>
    </div>

    <div class="hero-car gsap-hero-car" aria-hidden="true">
      <div class="speed-line line-one"></div>
      <div class="speed-line line-two"></div>
      <div class="car-shadow"></div>
      <div class="car-shape">
        <span class="headlight left-light"></span>
        <span class="headlight right-light"></span>
      </div>
      <strong>CGIC</strong>
    </div>
  </div>

  <div class="slider-dots" aria-hidden="true">
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>

  <div class="hero-search gsap-search">
    <app-renter-top-search
      [pickupLocation]="pickupLocation"
      [startDate]="startDate"
      [endDate]="endDate"
      [pickupTime]="pickupTime"
      [returnTime]="returnTime"
      [selectedSeats]="selectedSeats"
      [selectedCarType]="selectedCarType"
      [seatOptions]="seatOptions"
      [carTypeBySeats]="carTypeBySeats"
      [isSearching]="isSearching"
      (pickupLocationChange)="pickupLocationChange.emit($event)"
      (startDateChange)="startDateChange.emit($event)"
      (pickupTimeChange)="pickupTimeChange.emit($event)"
      (endDateChange)="endDateChange.emit($event)"
      (returnTimeChange)="returnTimeChange.emit($event)"
      (selectAllVehiclesRequest)="selectAllVehiclesRequest.emit()"
      (selectSeatRequest)="selectSeatRequest.emit($event)"
      (selectCarTypeRequest)="selectCarTypeRequest.emit($event)"
      (searchRequest)="searchRequest.emit()"
    ></app-renter-top-search>
  </div>

  <div class="payment-strip">
    <span>We accept</span>
    <strong>GCash</strong>
    <strong>VISA</strong>
    <strong>QR Ph</strong>
    <strong>Mastercard</strong>
  </div>
</section>

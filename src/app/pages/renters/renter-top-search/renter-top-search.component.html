<section class="search-summary-wrapper">
  <div class="search-summary-bar">
    <div class="summary-dropdown" [class.open]="isVehicleDropdownOpen">
      <button type="button" class="summary-pill vehicle-pill" (click)="toggleVehicleDropdown($event)">
        <div class="summary-icon vehicle-icon">🚘</div>
        <div class="summary-text">
          <strong>{{ selectedVehicleSummary }}</strong>
          <span>{{ selectedSeatSummary }}</span>
        </div>
        <span class="dropdown-arrow-text">⌄</span>
      </button>

      <div class="summary-dropdown-menu" *ngIf="isVehicleDropdownOpen" (click)="$event.stopPropagation()">
        <button type="button" class="dropdown-item" [class.active]="!selectedSeats && !selectedCarType" (click)="selectAllVehicles($event)">
          <strong>All Vehicles</strong>
          <span>Any seating capacity</span>
        </button>

        <div class="dropdown-section-title">Seats</div>

        <button type="button" class="dropdown-item" *ngFor="let seat of seatOptions" [class.active]="selectedSeats === seat && !selectedCarType" (click)="selectSeat(seat, $event)">
          <strong>{{ seat }} seater</strong>
          <span>{{ getCarTypesBySeatLabel(seat) }}</span>
        </button>

        <div class="dropdown-section-title" *ngIf="availableCarTypesForDropdown.length">Vehicle Type</div>

        <button type="button" class="dropdown-item" *ngFor="let type of availableCarTypesForDropdown" [class.active]="selectedCarType === type" (click)="selectCarType(type, $event)">
          <strong>{{ type }}</strong>
          <span>{{ selectedSeats ? selectedSeats + ' seater' : 'Any seating capacity' }}</span>
        </button>
      </div>
    </div>

    <app-renter-pickup-date-picker
      [value]="startDate"
      [pickupTime]="pickupTime"
      [disabled]="isSearching"
      (valueChange)="updateStartDate($event)"
      (pickupTimeChange)="updatePickupTime($event)"
    ></app-renter-pickup-date-picker>

    <app-renter-return-duration-picker
      [pickupDate]="startDate"
      [pickupTime]="pickupTime"
      [value]="endDate"
      [returnTime]="returnTime"
      [disabled]="isSearching || !startDate"
      (valueChange)="updateEndDate($event)"
      (returnTimeChange)="updateReturnTime($event)"
    ></app-renter-return-duration-picker>

    <label class="location-pill">
      <div class="summary-icon location-icon">📍</div>
      <div class="summary-text">
        <strong>Pickup Location</strong>
        <select
          [ngModel]="pickupLocation"
          (ngModelChange)="updatePickupLocation($event)"
          [disabled]="isSearching"
          aria-label="Pickup location"
        >
          <option value="">Select pickup location</option>
          <option *ngFor="let option of pickupLocationOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
    </label>

    <button type="button" class="summary-search-btn" [disabled]="!canSearch || isSearching" (click)="search()">
      <span class="spinner" *ngIf="isSearching"></span>
      <span class="ui-icon" aria-hidden="true" *ngIf="!isSearching">🔍</span>
      <span>{{ isSearching ? 'Searching...' : 'Search' }}</span>
    </button>
  </div>

  <div class="search-hint">
    <span>Free cancellation up to 24 hours before pick-up</span>
  </div>
</section>

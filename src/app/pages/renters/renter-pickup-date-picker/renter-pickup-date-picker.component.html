<button
  type="button"
  class="summary-pill pickup-date-pill"
  [class.disabled]="disabled"
  (click)="openPicker()"
>
  <div class="summary-icon">
    <span class="ui-icon" aria-hidden="true">📅</span>
  </div>

  <div class="summary-text">
    <strong>{{ pillTitle }}</strong>
    <span>{{ displayDraftTime }}</span>
  </div>
</button>

<div class="date-picker-backdrop" *ngIf="isOpen" (click)="closePicker()"></div>

<section class="date-picker-modal" *ngIf="isOpen" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
  <div class="modal-heading">
    <div>
      <h2>Select Pickup Date</h2>
      <p>Please select the date when you will pick up the vehicle.</p>
    </div>

    <button type="button" class="close-btn" (click)="closePicker()" aria-label="Close date picker">
      <span class="ui-icon" aria-hidden="true">×</span>
    </button>
  </div>

  <div class="selected-date-banner">
    <span>{{ selectedYear }}</span>
    <strong>{{ selectedDateHeader }}</strong>
  </div>

  <div class="calendar-nav">
    <button type="button" (click)="previousMonth()" aria-label="Previous month">‹</button>
    <strong>{{ monthLabel }}</strong>
    <button type="button" (click)="nextMonth()" aria-label="Next month">›</button>

    <button type="button" (click)="previousYear()" aria-label="Previous year">‹</button>
    <strong>{{ yearLabel }}</strong>
    <button type="button" (click)="nextYear()" aria-label="Next year">›</button>
  </div>

  <div class="calendar-grid">
    <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>

    <button
      type="button"
      class="calendar-day"
      *ngFor="let day of calendarDays"
      [class.other-month]="!day.isCurrentMonth"
      [class.today]="day.isToday"
      [class.selected]="day.isSelected"
      [class.disabled]="day.isDisabled"
      [disabled]="day.isDisabled"
      (click)="selectDate(day)"
    >
      {{ day.dayNumber }}
    </button>
  </div>

  <div class="time-section">
    <h2>Select Pickup Time</h2>
    <p>Please select the time when you will pick up the vehicle.</p>

    <button type="button" class="time-input-row" (click)="openTimePicker()">
      <span>{{ displayDraftTime }}</span>
      <span class="ui-icon" aria-hidden="true">🕒</span>
      <strong>Change Time</strong>
    </button>
  </div>

  <button type="button" class="confirm-btn" (click)="confirm()">
    Confirm
  </button>

  <section
    class="time-picker-popover"
    *ngIf="isTimePickerOpen"
    role="dialog"
    aria-label="Select pickup time"
    (click)="$event.stopPropagation()"
  >
    <div class="time-picker-top">
      <div class="time-display">
        <button
          type="button"
          [class.active]="timePickerMode === 'hour'"
          (click)="setTimePickerMode('hour')"
        >
          {{ selectedHour12 }}
        </button>
        <span>:</span>
        <button
          type="button"
          [class.active]="timePickerMode === 'minute'"
          (click)="setTimePickerMode('minute')"
        >
          {{ padMinute(selectedMinute) }}
        </button>
      </div>

      <div class="period-toggle">
        <button
          type="button"
          [class.active]="selectedPeriod === 'AM'"
          (click)="setPeriod('AM')"
        >
          AM
        </button>
        <button
          type="button"
          [class.active]="selectedPeriod === 'PM'"
          (click)="setPeriod('PM')"
        >
          PM
        </button>
      </div>
    </div>

    <div class="clock-face">
      <div class="clock-hand-wrapper" [style.transform]="clockHandTransform">
        <span></span>
      </div>
      <span class="clock-center"></span>

      <ng-container *ngIf="timePickerMode === 'hour'">
        <button
          type="button"
          class="clock-number"
          *ngFor="let hour of hourOptions"
          [class.active]="selectedHour12 === hour"
          [style.left.%]="getClockNumberLeft(hour, 'hour')"
          [style.top.%]="getClockNumberTop(hour, 'hour')"
          (click)="selectHour(hour)"
        >
          {{ hour }}
        </button>
      </ng-container>

      <ng-container *ngIf="timePickerMode === 'minute'">
        <button
          type="button"
          class="clock-number minute-number"
          *ngFor="let minute of minuteOptions"
          [class.active]="isMinuteActive(minute)"
          [style.left.%]="getClockNumberLeft(minute, 'minute')"
          [style.top.%]="getClockNumberTop(minute, 'minute')"
          (click)="selectMinute(minute)"
        >
          {{ padMinute(minute) }}
        </button>
      </ng-container>
    </div>

    <div class="time-picker-actions">
      <button type="button" (click)="closeTimePicker()">Close</button>
    </div>
  </section>
</section>

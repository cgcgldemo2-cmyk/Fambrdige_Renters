<section class="booking-section" id="search" [class.summary-mode]="mode === 'summary'">
  <div class="container">
    <form class="search-card" *ngIf="mode === 'form'" (ngSubmit)="submitSearch()" novalidate>
      <label class="pickup-field">
        <span>Pickup Location</span>
        <input [(ngModel)]="pickupKeyword" name="pickupLocation" autocomplete="off"
          (input)="onPickupInput()" (focus)="onPickupInput()" (blur)="hidePickupSuggestions()"
          [class.selected]="search.pickupLocationId" placeholder="Choose a pickup location" />
        <small class="selected-location" *ngIf="search.pickupLocationId && search.pickupCity">Selected · {{ search.pickupCity }}</small>
        <div class="suggestions" *ngIf="showPickupSuggestions">
          <div class="suggestion-loading" *ngIf="isLoadingPickupLocations">Loading pickup locations…</div>
          <button type="button" class="suggestion-item" *ngFor="let location of filteredPickupLocations"
            (mousedown)="$event.preventDefault(); selectPickupLocation(location)">
            <strong>{{ location.shortName }}</strong><span>{{ location.name }}</span>
            <small>{{ location.city }}<ng-container *ngIf="location.province">, {{ location.province }}</ng-container></small>
          </button>
          <div class="suggestion-empty" *ngIf="!isLoadingPickupLocations && pickupErrorMessage">
            {{ pickupErrorMessage }}
            <button type="button" (mousedown)="$event.preventDefault(); loadPickupLocations()">Try Again</button>
          </div>
          <div class="suggestion-empty" *ngIf="!isLoadingPickupLocations && !pickupErrorMessage && filteredPickupLocations.length === 0">
            No pickup locations match your search.
          </div>
        </div>
      </label>

      <label><span>Pickup Date</span><input type="date" name="pickupDate" [min]="minPickupDate" [(ngModel)]="search.pickupDate" (change)="onPickupScheduleChange()" /></label>
      <label><span>Pickup Time</span><input type="time" name="pickupTime" [(ngModel)]="search.pickupTime" (change)="onPickupScheduleChange()" /></label>
      <label><span>Return Date</span><input type="date" name="returnDate" [min]="search.pickupDate" [(ngModel)]="search.returnDate" (change)="onReturnScheduleChange()" /></label>
      <label><span>Return Time</span><input type="time" name="returnTime" [(ngModel)]="search.returnTime" (change)="onReturnScheduleChange()" /></label>
      <label><span>Rental Duration</span>
        <div class="duration-input">
          <button type="button" aria-label="Decrease rental days" (click)="decreaseDays()">−</button>
          <input type="number" name="rentalDays" min="1" [(ngModel)]="search.rentalDays" (blur)="onRentalDaysChange()" />
          <span>{{ search.rentalDays === 1 ? 'Day' : 'Days' }}</span>
          <button type="button" aria-label="Increase rental days" (click)="increaseDays()">+</button>
        </div>
      </label>
      <label><span>Rental Type</span>
        <select name="rentalType" [(ngModel)]="search.rentalType"><option>With Driver</option><option>Self Drive</option></select>
      </label>

      <div class="validation-message" *ngIf="validationMessage" role="alert">{{ validationMessage }}</div>
      <button class="search-btn" type="submit" [disabled]="isSubmitting || isLoadingPickupLocations">
        {{ isSubmitting ? 'Opening available cars…' : 'Search Available Cars' }}
      </button>
    </form>

    <div class="summary-card" *ngIf="mode === 'summary'">
      <div class="summary-item"><div><small>Pickup Location</small><strong>{{ search.pickupLocation }}</strong><p>{{ search.pickupCity }}</p></div></div>
      <div class="summary-item"><div><small>Pickup</small><strong>{{ summaryPickupDate }}</strong><p>{{ summaryPickupTime }}</p></div></div>
      <div class="summary-item"><div><small>Return</small><strong>{{ search.returnDate }}</strong><p>{{ search.returnTime }}</p></div></div>
      <div class="summary-item"><div><small>Rental Type</small><strong>{{ search.rentalType }}</strong><p>{{ search.rentalDays }} day(s)</p></div></div>
      <button class="edit-btn" type="button" (click)="editSearch.emit()">Edit Search</button>
    </div>
  </div>
</section>

<app-renter-page-shell><section class="page-container portal-page form-page"><div class="page-heading"><span class="eyebrow">Account security</span><h1>Change Password</h1><p>Use a strong password you do not use elsewhere.</p></div><div class="api-pending-note">Change password API pending · Password values are never stored by the preview service.</div><form class="surface portal-form" [formGroup]="form" (ngSubmit)="submit()" novalidate><label>Current password<div class="password-control"><input [type]="showCurrent ? 'text' : 'password'" formControlName="currentPassword" autocomplete="current-password"><button type="button" (click)="showCurrent = !showCurrent">{{ showCurrent ? 'Hide' : 'Show' }}</button></div><small *ngIf="form.controls.currentPassword.touched && form.controls.currentPassword.invalid">Enter your current password.</small></label><label>New password<div class="password-control"><input [type]="showNew ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password"><button type="button" (click)="showNew = !showNew">{{ showNew ? 'Hide' : 'Show' }}</button></div><small *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid">Use at least 8 characters with a letter and number.</small></label><label>Confirm new password<div class="password-control"><input [type]="showConfirm ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password"><button type="button" (click)="showConfirm = !showConfirm">{{ showConfirm ? 'Hide' : 'Show' }}</button></div><small *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')">Confirm your new password.</small><small *ngIf="form.controls.confirmPassword.hasError('mismatch')">Passwords do not match.</small></label><div class="form-alert success-state" *ngIf="successMessage" role="status">{{ successMessage }}</div><div class="form-alert error-state" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div><button class="primary-button wide" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Validating…' : 'Change Password' }}</button></form></section></app-renter-page-shell>
